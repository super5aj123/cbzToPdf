name: Build executables

on:
  push:
    branches:
      - build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            executable: dist/cbzToPdf
          - name: Windows (x64)
            os: windows-latest
            executable: dist/cbzToPdf.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install pyinstaller pillow pillow-jxl-plugin

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name cbzToPdf --collect-all pillow_jxl cbzToPdf.py

      - name: Verify executable was created
        shell: bash
        run: test -f "${{ matrix.executable }}"

      # A tar archive preserves the executable bit on macOS.
      - name: Package macOS executable
        if: runner.os == 'macOS'
        run: tar -czf cbzToPdf-macos-arm64.tar.gz -C dist cbzToPdf

      - name: Upload macOS executable
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: cbzToPdf-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/cbzToPdf.exe
          archive: false
          if-no-files-found: error
